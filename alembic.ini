# Alembic configuration. The database URL is injected at runtime from
# cinch.core.config (see migrations/env.py) — never hard-coded here.

[alembic]
script_location = migrations
prepend_sys_path = src
# Split path-like config options (prepend_sys_path, version_locations) on the OS
# path separator rather than the legacy space/comma/colon behaviour.
path_separator = os
# New migrations are formatted by the project's pre-commit / `ruff format` pass,
# so no Alembic post-write hook is configured (keeps `alembic` dependency-light).

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
