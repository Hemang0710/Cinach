[project]
name = "cinch"
version = "0.0.0"
description = "Open-source, human-in-the-loop job application assistant with LLM resume tailoring and a Telegram approval bot."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Hemang P" }]
keywords = ["job-search", "resume", "telegram-bot", "llm", "fastapi"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]

dependencies = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.0",
    "python-telegram-bot[rate-limiter]>=22.8,<23",
    "sqlalchemy[asyncio]>=2.0.51",
    "asyncpg>=0.31.0",
    "aiosqlite>=0.22.1",
    "alembic>=1.18.5",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "structlog>=26.1.0",
    "apscheduler>=3.11.3",
    "httpx>=0.28.1",
    "sentry-sdk[fastapi]>=2.66.1",
    "anthropic>=0.69",
    "openai>=1.50",  # also drives Groq (free, OpenAI-compatible) via a custom base URL
    "cryptography>=43",
    "fpdf2>=2.7",  # pure-Python PDF generation for tailored resume delivery (Phase 9)
]

[project.optional-dependencies]
dev = [
    "ruff>=0.16.0",
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
]
# Optional: Phase 6 assisted submission. Lazy-imported, off by default. After
# installing this extra, run `playwright install chromium` to fetch the browser.
submit = [
    "playwright>=1.49",
]

[project.urls]
Homepage = "https://github.com/Hemang0710/Cinach"
Repository = "https://github.com/Hemang0710/Cinach"
Issues = "https://github.com/Hemang0710/Cinach/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cinch"]

# ---------------------------------------------------------------------------
# uv
# ---------------------------------------------------------------------------
[tool.uv]
# Dev dependencies are declared under [project.optional-dependencies].dev and
# installed with `uv sync --extra dev`.

# ---------------------------------------------------------------------------
# Ruff (lint + format)
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "ASYNC", # flake8-async
    "S",   # flake8-bandit (security)
    "RUF", # ruff-specific
]
ignore = [
    "S101", # assert used (allowed in tests; see per-file-ignores)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.ruff.lint.isort]
known-first-party = ["cinch"]

# ---------------------------------------------------------------------------
# mypy (strict)
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
no_implicit_reexport = true
plugins = ["pydantic.mypy"]
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["apscheduler.*"]
ignore_missing_imports = true

# Playwright is the optional `submit` extra — not installed in the type-check env.
[[tool.mypy.overrides]]
module = ["playwright.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=cinch --cov-report=term-missing --cov-branch --cov-fail-under=80"

# ---------------------------------------------------------------------------
# coverage
# ---------------------------------------------------------------------------
[tool.coverage.run]
branch = true
source = ["cinch"]
# The Playwright adapter drives a real Chromium browser via the optional `submit`
# extra (`playwright install chromium`) and cannot run in CI. Its pure, testable
# logic lives in providers/submit/render.py; the browser automation is integration-only.
omit = ["*/providers/submit/playwright.py"]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
